<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
<title id="t">Illustration of Hide, the guide</title>
<defs>
<clipPath id="c"><circle cx="200" cy="200" r="200"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe0"/><stop offset="1" stop-color="#e9dcc3"/></linearGradient>
<linearGradient id="jk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f78c4"/><stop offset="1" stop-color="#1f5c9e"/></linearGradient>
</defs>
<circle cx="200" cy="200" r="200" fill="#fffaf0"/>
<g clip-path="url(#c)">
<rect width="400" height="400" fill="url(#bg)"/>
<!-- torii hint in background -->
<g fill="none" stroke="#c23e27" stroke-width="9" stroke-linecap="round" opacity=".16">
<path d="M40 120 Q200 96 360 120"/><path d="M62 146 H338"/><path d="M98 120 V330"/><path d="M302 120 V330"/>
</g>
<!-- shoulders / jacket -->
<path d="M70 400 C74 318 120 290 168 280 L232 280 C280 290 326 318 330 400 Z" fill="url(#jk)"/>
<path d="M168 280 L200 332 L232 280 Z" fill="#6b6f74"/>
<path d="M162 280 L184 336 L200 332 L176 282 Z" fill="#2a6db5"/>
<path d="M238 280 L216 336 L200 332 L224 282 Z" fill="#2a6db5"/>
<path d="M200 332 V400" stroke="#174a80" stroke-width="3"/>
<!-- neck -->
<path d="M178 250 h44 v34 q-22 12 -44 0 z" fill="#e2b48f"/>
<!-- head -->
<ellipse cx="200" cy="196" rx="68" ry="78" fill="#efc6a2"/>
<!-- ears -->
<ellipse cx="132" cy="204" rx="10" ry="16" fill="#e7b994"/>
<ellipse cx="268" cy="204" rx="10" ry="16" fill="#e7b994"/>
<!-- hair -->
<path d="M130 196 C122 132 158 104 204 106 C250 106 282 134 270 196 C266 170 254 152 236 146 C214 158 176 160 150 150 C138 160 132 176 130 196 Z" fill="#1d1a19"/>
<!-- glasses -->
<g fill="none" stroke="#1d1a19" stroke-width="6" stroke-linejoin="round">
<rect x="146" y="186" width="46" height="32" rx="7"/>
<rect x="208" y="186" width="46" height="32" rx="7"/>
<path d="M192 199 q8 -6 16 0"/>
<path d="M146 196 l-14 -2"/><path d="M254 196 l14 -2"/>
</g>
<!-- simple smile only, no detailed features -->
<path d="M184 244 q16 12 32 0" fill="none" stroke="#9b5b45" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
